# TJSV-admitted ORES middleware baseline: ORESoftware/ores-middleware@ee75f0a67cf23895500846402fbc757aa0686530.
# Same-root hybrid is deliberate; ambiguous callers must select an explicit target.
schema_version = 1
repository_mode = "hybrid"
allow_overlapping_roots = true
default_target = "client"

[[targets]]
name = "server"
role = "server"
roots = ["."]
middleware = "disabled"

[[targets]]
name = "client"
role = "client"
roots = ["."]
middleware = "propagation-only"
propagate_headers = ["traceparent", "tracestate", "baggage", "x-request-id"]
